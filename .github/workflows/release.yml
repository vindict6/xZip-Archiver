name: Release

# Builds every platform and publishes a GitHub release.
# Trigger it by pushing a tag (git tag v0.1.0 && git push --tags) or from the
# Actions tab with "Run workflow" and a tag name.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0). Created if it does not exist."
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - name: Build
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Test
        run: cargo test -p xzip-core --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.tag || github.ref_name }}"
          $dir = "dist/xzip-$v-${{ matrix.name }}"
          New-Item -ItemType Directory -Force $dir, "$dir/completions" | Out-Null
          Copy-Item target/${{ matrix.target }}/release/xzip.exe, target/${{ matrix.target }}/release/xzip-gui.exe, README.md, LICENSE, THIRD_PARTY.md $dir
          & "$dir/xzip.exe" completions powershell > "$dir/completions/xzip.ps1"
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/xzip-$v-${{ matrix.name }}.zip"
          Remove-Item -Recurse $dir
          Get-FileHash dist/*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File -Encoding ascii "dist/xzip-$v-${{ matrix.name }}.sha256"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          v="${{ github.event.inputs.tag || github.ref_name }}"
          dir="dist/xzip-$v-${{ matrix.name }}"
          mkdir -p "$dir/completions" "$dir/man"
          cp target/${{ matrix.target }}/release/xzip target/${{ matrix.target }}/release/xzip-gui README.md LICENSE THIRD_PARTY.md "$dir"
          for s in bash zsh fish; do "$dir/xzip" completions $s > "$dir/completions/xzip.$s"; done
          "$dir/xzip" man > "$dir/man/xzip.1"
          cp packaging/xzip-gui.desktop "$dir/"
          cp assets/icon.png "$dir/xzip-gui.png"
          tar -C dist -czf "dist/xzip-$v-${{ matrix.name }}.tar.gz" "$(basename "$dir")"
          rm -rf "$dir"
          (cd dist && sha256sum *.tar.gz > "xzip-$v-${{ matrix.name }}.sha256")

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          v="${{ github.event.inputs.tag || github.ref_name }}"
          dir="dist/xzip-$v-${{ matrix.name }}"
          app="$dir/xZip Archiver.app"
          mkdir -p "$dir/completions" "$dir/man" "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/${{ matrix.target }}/release/xzip README.md LICENSE THIRD_PARTY.md "$dir"
          cp target/${{ matrix.target }}/release/xzip-gui "$app/Contents/MacOS/xzip-gui"
          sed "s/__VERSION__/${v#v}/" packaging/Info.plist > "$app/Contents/Info.plist"
          # icon: png -> icns with the tools every macOS runner has
          mkdir icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s assets/icon.png --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) assets/icon.png --out "icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/xzip.icns"
          for s in bash zsh fish; do "$dir/xzip" completions $s > "$dir/completions/xzip.$s"; done
          "$dir/xzip" man > "$dir/man/xzip.1"
          tar -C dist -czf "dist/xzip-$v-${{ matrix.name }}.tar.gz" "$(basename "$dir")"
          rm -rf "$dir"
          (cd dist && shasum -a 256 *.tar.gz > "xzip-$v-${{ matrix.name }}.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS.txt && ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: xZip Archiver ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
