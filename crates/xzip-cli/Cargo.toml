[package]
name = "xzip-cli"
description = "xzip command line archiver"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "xzip"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.5.61", features = ["derive", "wrap_help", "env"] }
clap_complete = "4.5.67"
clap_mangen = "0.2.32"
ctrlc = "3.5.2"
globset = "0.4.19"
indicatif = "0.18.4"
rayon = "1.12.0"
rpassword = "7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
xzip-core = { path = "../xzip-core" }
